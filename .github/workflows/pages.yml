# pages.yml: build the site from a fresh checkout and deploy it to GitHub Pages at https://mmmugh.github.io/groundwork/
# (D82, D103). Run by hand (workflow_dispatch), each deploy on the author's go; Plan 5 decides whether a push to main
# deploys on its own. A fresh checkout has no site/ (it is git-ignored), so what is deployed is exactly what this build
# wrote. `--check` runs the publishing guard now, and every gate (the audit, the vocabulary gate, the fork gate) once a
# volume exists.
name: pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 25.9.0
      - run: bash ci/setup.sh
      - run: source ci/lib.sh && "$J" build/Build.java --check
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
